<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto con el anfitrión | GranReserva</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f7f1; color: #24331f; margin: 0; }
    main { max-width: 560px; margin: 32px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { color: #2f6b2f; margin-top: 0; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #b7c7b0; border-radius: 6px; box-sizing: border-box; font: inherit; }
    button { margin-top: 20px; background: #2f6b2f; color: #fff; border: 0; padding: 12px 20px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    hr { margin: 28px 0; border: 0; border-top: 1px solid #dfe8da; }
    a { color: #2f6b2f; }
  </style>
</head>
<body>
  <main>
    <h1>Contacto con el anfitrión</h1>
    <p>Envía tu pregunta sobre un salón. El mensaje se envía al servlet con el método <strong>POST</strong>.</p>

    <!-- Formulario HTML que envía los datos al servlet ContactoServlet (doPost) -->
    <form action="contacto" method="post" accept-charset="UTF-8">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="80">

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>

      <label for="salon">Salón de interés</label>
      <select id="salon" name="salon" required>
        <option value="">Elige un salón</option>
        <option>Salón Jardín Botánico</option>
        <option>Salón Terraza del Parque</option>
        <option>Salón Casa Colonial</option>
        <option>Salón Mirador</option>
        <option>Salón Lago Azul</option>
      </select>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="4" maxlength="500" required></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>

    <hr>

    <h2>Consultar salones</h2>
    <p>Este formulario usa el método <strong>GET</strong> (doGet del servlet): los datos viajan en la URL.</p>
    <form action="contacto" method="get">
      <label for="capacidad">Capacidad mínima (personas)</label>
      <input type="number" id="capacidad" name="capacidad" min="0" placeholder="Ej: 100">
      <button type="submit">Buscar salones</button>
    </form>
    <p><a href="contacto">Ver todos los salones</a></p>
  </main>
</body>
</html>
