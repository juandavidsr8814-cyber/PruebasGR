<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña | GranReserva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <main class="contenedor-auth">
    <section class="panel-salon" aria-hidden="true">
      <div class="arcos">
        <span class="arco arco--1"></span>
        <span class="arco arco--2"></span>
        <span class="arco arco--3"></span>
        <span class="arco arco--4"></span>
      </div>
      <p class="panel-salon__marca">GranReserva</p>
      <div class="panel-salon__mensaje">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p>Te ayudamos a recuperar el acceso a tu cuenta en un par de pasos.</p>
      </div>
    </section>

    <section class="panel-formulario">
      <div class="tarjeta-form">
        <p class="tarjeta-form__eyebrow">Recuperación de acceso</p>
        <h2>Restablece tu contraseña</h2>
        <p class="tarjeta-form__subtitulo">Ingresa el correo asociado a tu cuenta y te enviaremos un enlace.</p>

        <div id="mensaje-recuperar" class="mensaje-estado" role="alert"></div>

        <form id="form-recuperar" novalidate>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" autocomplete="email" required />
            <small id="error-correo" class="campo__error"></small>
          </div>

          <button type="submit" class="boton-primario">Enviar enlace de recuperación</button>
        </form>

        <p class="tarjeta-form__pie">
          <a href="login.html" class="enlace-secundario">Volver a iniciar sesión</a>
        </p>
      </div>
    </section>
  </main>

  <script src="js/validaciones.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
